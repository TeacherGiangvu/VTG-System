<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>VTG CRM – Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main>
  <div class="card login">
    <h1>VTG CRM</h1>
    <p class="sub" style="color:var(--muted)">Enter your access code.</p>
    <form id="f">
      <label for="code">Access code</label>
      <input id="code" type="password" autocomplete="current-password" required autofocus>
      <p class="err" id="err"></p>
      <button class="btn" id="go" type="submit">Log in</button>
    </form>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('f').onsubmit = function (e) {
  e.preventDefault();
  var go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = '';
  VTG.api('login', { code: document.getElementById('code').value })
    .then(function (d) {
      VTG.store.set('vtg_token', d.token);
      VTG.store.set('vtg_user', JSON.stringify({ name: d.name, role: d.role }));
      location.href = d.role === 'sales' ? 'leads.html' : 'index.html';
    })
    .catch(function (x) {
      err.textContent = x.message === 'bad_code' ? 'Wrong code.' : x.message === 'locked' ? 'Too many tries. Wait 10 minutes.' : x.message;
      go.disabled = false;
    });
};
</script>
</body>
</html>
