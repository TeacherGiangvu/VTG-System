<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>VTG CRM – Lead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main>
  <p><a href="leads.html">← Leads</a></p>
  <h1 id="title">New lead</h1>
  <div class="grid">
    <section class="card">
      <h2>Details</h2>
      <form id="f">
        <label>Name *</label><input name="name" required>
        <label>Phone</label><input name="phone" inputmode="tel">
        <label>Parent name</label><input name="parent_name">
        <label>Source</label><select name="source"></select>
        <label>Stage</label><select name="stage"></select>
        <label>Owner</label><select name="owner"></select>
        <label>Next follow-up</label><input name="next_followup" type="date">
        <label>Why lost (if Lost)</label><input name="lost_reason">
        <label>Note</label><textarea name="note"></textarea>
        <div class="row" style="margin-top:.9rem">
          <button class="btn" type="submit">Save</button>
          <button class="btn alt" type="button" id="convert" hidden>Convert to student</button>
        </div>
      </form>
    </section>
    <section class="card" id="fu-card" hidden>
      <h2>Follow-ups</h2>
      <form id="fuf">
        <label>Note</label><textarea name="note" placeholder="What happened / what to do next"></textarea>
        <label>Next due date</label><input name="due_date" type="date">
        <button class="btn" type="submit" style="margin-top:.7rem">Add</button>
      </form>
      <div class="timeline" id="tl" style="margin-top:1rem"></div>
    </section>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
var u = VTG.boot('leads'), E = VTG.esc;
var id = new URLSearchParams(location.search).get('id');
var f = document.getElementById('f');
var FIELDS = ['name', 'phone', 'parent_name', 'source', 'stage', 'owner', 'next_followup', 'lost_reason', 'note'];

function fill(sel, list, blank) {
  sel.innerHTML = (blank ? '<option value=""></option>' : '') + list.map(function (v) { return '<option>' + E(v) + '</option>'; }).join('');
}
function show(lead) {
  FIELDS.forEach(function (k) { f.elements[k].value = lead[k] || ''; });
  document.getElementById('title').textContent = lead.name;
}
function timeline(list) {
  document.getElementById('tl').innerHTML = list.length ? list.map(function (x) {
    return '<div class="item"><div class="sub">' + E(x.created_at) + ' · ' + E(x.by) +
      (x.due_date ? ' · due <span class="tag' + (x.done ? '' : '') + '">' + E(x.due_date) + '</span>' : '') + (x.done ? ' ✓' : '') + '</div><div>' + E(x.note) + '</div></div>';
  }).join('') : '<div class="empty">' + VTG.tr('nothing') + '</div>';
}
function load() {
  VTG.api('lead', { id: id }).then(function (d) { show(d.lead); timeline(d.followups); }).catch(function (e) { VTG.toast(e.message, true); });
}

if (u) {
  VTG.api('options').then(function (o) {
    fill(f.elements.source, o.sources, true);
    fill(f.elements.stage, o.stages);
    fill(f.elements.owner, o.owners, true);
    if (u.role === 'sales') f.elements.owner.disabled = true;
    if (id) {
      document.getElementById('convert').hidden = false;
      if (u.role !== 'sales') document.getElementById('fu-card').hidden = false;
      load();
    }
  }).catch(function (e) { VTG.toast(e.message, true); });
}

f.onsubmit = function (e) {
  e.preventDefault();
  var lead = { id: id || undefined };
  FIELDS.forEach(function (k) { lead[k] = f.elements[k].value; });
  VTG.api('saveLead', { lead: lead }).then(function (saved) {
    VTG.toast(VTG.tr('saved'));
    if (!id) location.href = 'lead.html?id=' + encodeURIComponent(saved.id);
    else show(saved);
  }).catch(function (x) { VTG.toast(x.message, true); });
};

document.getElementById('convert').onclick = function () {
  if (!confirm('Mark this lead as Enrolled?')) return;
  VTG.api('convert', { id: id }).then(function (l) { show(l); VTG.toast('Enrolled'); }).catch(function (x) { VTG.toast(x.message, true); });
};

document.getElementById('fuf').onsubmit = function (e) {
  e.preventDefault();
  var fm = e.target;
  VTG.api('addFollowup', { lead_id: id, note: fm.elements.note.value, due_date: fm.elements.due_date.value })
    .then(function () { fm.reset(); load(); VTG.toast(VTG.tr('saved')); })
    .catch(function (x) { VTG.toast(x.message, true); });
};
</script>
</body>
</html>
