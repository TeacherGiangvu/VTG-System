<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>VTG CRM – Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main>
  <h1 id="title">Today</h1>
  <div class="grid">
    <section class="card"><h2 id="h-over"></h2><div id="over"></div></section>
    <section class="card"><h2 id="h-due"></h2><div id="due"></div></section>
    <section class="card"><h2 id="h-new"></h2><div id="new"></div></section>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
var u = VTG.boot('today');
if (u && u.role === 'sales') location.href = 'leads.html';
var E = VTG.esc;
function fu(list, late) {
  if (!list.length) return '<div class="empty">' + VTG.tr('nothing') + '</div>';
  return list.map(function (f) {
    return '<div class="item"><div><a href="lead.html?id=' + encodeURIComponent(f.lead_id) + '"><b>' + E(f.lead_name) + '</b></a>' +
      '<div class="sub">' + E(f.note) + '</div></div><div><span class="tag' + (late ? ' late' : '') + '">' + E(f.due_date) + '</span> ' +
      '<button class="btn ghost" data-done="' + E(f.id) + '">✓</button></div></div>';
  }).join('');
}
function load() {
  VTG.api('today').then(function (d) {
    document.getElementById('title').textContent = VTG.tr('today') + ' · ' + d.today;
    document.getElementById('h-over').textContent = VTG.tr('overdue') + ' (' + d.overdue.length + ')';
    document.getElementById('h-due').textContent = VTG.tr('dueToday') + ' (' + d.due.length + ')';
    document.getElementById('h-new').textContent = VTG.tr('newLeads') + ' (' + d.new_leads.length + ')';
    document.getElementById('over').innerHTML = fu(d.overdue, true);
    document.getElementById('due').innerHTML = fu(d.due, false);
    document.getElementById('new').innerHTML = d.new_leads.length ? d.new_leads.map(function (l) {
      return '<a class="lead" href="lead.html?id=' + encodeURIComponent(l.id) + '"><b>' + E(l.name) + '</b><small>' + E(l.source) + ' · ' + E(l.phone) + '</small></a>';
    }).join('') : '<div class="empty">' + VTG.tr('nothing') + '</div>';
  }).catch(function (e) { VTG.toast(e.message, true); });
}
document.addEventListener('click', function (e) {
  var id = e.target.getAttribute && e.target.getAttribute('data-done');
  if (!id) return;
  e.target.disabled = true;
  VTG.api('doneFollowup', { id: id }).then(load).catch(function (x) { VTG.toast(x.message, true); e.target.disabled = false; });
});
if (u) load();
</script>
</body>
</html>
